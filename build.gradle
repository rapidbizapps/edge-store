buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:1.9.0'
        classpath 'io.objectbox:objectbox-gradle-plugin:5.0.1'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'io.objectbox'
apply plugin: 'maven-publish'

android {
    namespace "com.github.rapidbizapps.edgestore"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    publishing {
        singleVariant("release")
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'io.objectbox:objectbox-android:5.0.1'
    implementation 'io.objectbox:objectbox-kotlin:5.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = (findProperty("group") ?: "com.github.rapidbizapps").toString()
                artifactId = "edge-store"
                version = (findProperty("version") ?: "local").toString()
            }
        }
    }
}
